<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stories · The Backbench</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfbf9;--ink:#111;--mute:#6b6b6b;--line:#dcdad5;--card:#fff;--hover:#f3f2ef;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f3f1ed;--mute:#9a9a9a;--line:#2e2e2e;--card:#0b0b0b;--hover:#161616;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;max-width:860px;width:100%;margin:0 auto;flex-wrap:wrap}
.wm{font:700 18px 'Playfair Display',serif}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;color:var(--mute);border:1px solid transparent;border-radius:999px;padding:7px 14px;font:500 14px Inter,sans-serif;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--line);background:var(--card)}
main{max-width:860px;margin:0 auto;padding:8px 24px 48px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(32px,5vw,48px);line-height:1.1;margin:8px 0 8px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 22px}
.gate{max-width:420px}
input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--ink)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:12px 22px;border-radius:999px;font:500 14px Inter,sans-serif;cursor:pointer}
.btn:hover{opacity:.85}
.ghost{background:transparent;color:var(--ink)}
.err{min-height:22px;margin:10px 0 0;font-size:14px;font-weight:500}
.list{display:grid;gap:12px}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 20px;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.when{font-size:13px;color:var(--mute)}
.topic{font:600 16px Inter,sans-serif;margin:8px 0 4px}
.who{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mute);margin-bottom:10px}
.story{margin:0;white-space:pre-wrap}
.card footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.flag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.empty{color:var(--mute);padding:28px 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <span class="wm">The Backbench</span>
  <div class="tabs" id="tabs" hidden>
    <button type="button" data-filter="all" class="on">All</button>
    <button type="button" data-filter="unread">Unread</button>
    <button type="button" data-filter="read">Read</button>
  </div>
</div>
<main>
  <section id="gate" class="gate">
    <h1>Stories</h1>
    <p class="lead">Enter the password to open this page.</p>
    <form id="login">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Open</button>
    </form>
  </section>
  <section id="board" hidden>
    <h1>Stories</h1>
    <p class="lead" id="count"></p>
    <div class="list" id="list"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let stories = [];
let filter = "all";
const when = new Intl.DateTimeFormat("en-IN", {
  timeZone: "Asia/Kolkata",
  day: "numeric",
  month: "short",
  year: "numeric",
  hour: "numeric",
  minute: "2-digit",
});

function visible() {
  return stories.filter((item) => filter === "all" || (filter === "read" ? item.read : !item.read));
}

function render() {
  const rows = visible();
  const unread = stories.filter((item) => !item.read).length;
  $("#count").textContent = stories.length + " total · " + unread + " unread";
  $("#list").innerHTML = rows.length ? "" : '<p class="empty">Nothing in this section.</p>';
  for (const item of rows) {
    const card = document.createElement("article");
    card.className = "card";
    card.onclick = () => { location.href = "/admin/story/" + item.id; };
    const head = document.createElement("header");
    const topic = document.createElement("div");
    topic.className = "topic";
    topic.textContent = item.topic;
    const time = document.createElement("time");
    time.className = "when";
    time.dateTime = item.createdAt;
    time.textContent = when.format(new Date(item.createdAt));
    head.append(topic, time);
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = item.who;
    const body = document.createElement("p");
    body.className = "story";
    body.textContent = item.story;
    const foot = document.createElement("footer");
    const flag = document.createElement("span");
    flag.className = "flag";
    flag.textContent = item.read ? "Read" : "Unread";
    const button = document.createElement("button");
    button.className = "btn ghost";
    button.type = "button";
    button.textContent = item.read ? "Mark unread" : "Mark read";
    button.onclick = (event) => {
      event.stopPropagation();
      setRead(item, !item.read, button);
    };
    foot.append(flag, button);
    card.append(head, who, body, foot);
    $("#list").append(card);
  }
}

async function load() {
  const res = await fetch("/api/admin/stories");
  if (res.status === 401) return false;
  if (!res.ok) throw new Error("load failed");
  stories = (await res.json()).stories;
  $("#gate").hidden = true;
  $("#tabs").hidden = false;
  $("#board").hidden = false;
  render();
  return true;
}

async function setRead(item, read, button) {
  button.disabled = true;
  const res = await fetch("/api/admin/stories/" + item.id, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ read }),
  });
  button.disabled = false;
  if (!res.ok) return;
  item.read = read;
  render();
}

$("#tabs").onclick = (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  filter = button.dataset.filter;
  $("#tabs").querySelectorAll("button").forEach((tab) => tab.classList.toggle("on", tab === button));
  render();
};

$("#login").onsubmit = async (event) => {
  event.preventDefault();
  $("#err").textContent = "";
  const res = await fetch("/api/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("#password").value }),
  });
  if (!res.ok) {
    $("#err").textContent = "Wrong password.";
    return;
  }
  await load();
};

load().catch(() => {
  $("#err").textContent = "Could not open the stories.";
});
</script>
</body>
</html>
